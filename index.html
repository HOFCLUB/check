<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HOF Member Check</title>
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0b0b0b;color:#fff;text-align:center}
  .bar{background:#5f6368;padding:28px 16px;font-size:34px;font-weight:bold;letter-spacing:2px}
  .sub{font-size:15px;font-weight:normal;letter-spacing:0;margin-top:6px}
  img{width:220px;height:220px;object-fit:cover;border-radius:12px;margin-top:28px;border:3px solid #5f6368;display:none}
  .name{font-size:30px;font-weight:bold;margin-top:18px}
  .num{color:#aaa;margin-top:6px;font-size:16px}
  .badge{display:none;margin-top:14px;padding:6px 12px;border:1px solid #e10600;color:#ff4a3d;font-size:12px;letter-spacing:2px}
  .foot{color:#666;font-size:11px;letter-spacing:3px;margin:40px 16px}
</style>
</head>
<body>
  <div class="bar" id="bar">CHECKING<div class="sub" id="sub">One moment...</div></div>
  <img id="photo" alt="">
  <div class="name" id="name"></div>
  <div class="num" id="num"></div>
  <div class="badge" id="badge"></div>
  <div class="foot">HEART OF FIRE RUN CLUB · POWERED BY ESCAPAID</div>

<script>
  // The HOF script's Web app URL (the /exec link). Only change this if the deployment link ever changes.
  var API_URL = 'https://script.google.com/macros/s/AKfycbzHBD01gUyM6oNEaT3wwxbyH5_n4590y8AdHduJ-TRCKZXuKxFt-5qaOXFMQ6krSAFNVQ/exec';

  var LOOK = {
    ACTIVE:   ['#1e8e3e', 'ACTIVE',   'Good to go'],
    INACTIVE: ['#d93025', 'INACTIVE', 'Membership not active. Please see the admin exec.'],
    PENDING:  ['#f29900', 'PENDING',  'Payment not verified yet. Please see the admin exec.'],
    UNKNOWN:  ['#5f6368', 'UNKNOWN',  'Card not recognised. Please see the admin exec.'],
    OFFLINE:  ['#5f6368', 'TRY AGAIN','Could not reach the member list. Check your signal and refresh.']
  };
  var BADGES = { FOUNDING: 'FOUNDING MEMBER', VOLUNTEER: 'TEAM · VOLUNTEER', EXEC: 'TEAM · EXEC', MEMBER: 'MEMBER' };

  function show(key, m) {
    var s = LOOK[key] || LOOK.UNKNOWN;
    var bar = document.getElementById('bar');
    bar.style.background = s[0];
    bar.firstChild.nodeValue = s[1];
    document.getElementById('sub').textContent = s[2];
    if (!m) return;
    var img = document.getElementById('photo');
    if (m.photo) { img.src = m.photo; img.style.borderColor = s[0]; img.style.display = 'inline-block'; }
    document.getElementById('name').textContent = m.first || '';
    document.getElementById('num').textContent = m.num || '';
    var b = BADGES[m.type];
    if (b) { var el = document.getElementById('badge'); el.textContent = b; el.style.display = 'inline-block'; }
  }

  var id = new URLSearchParams(location.search).get('id') || '';
  if (!id) {
    show('UNKNOWN');
  } else {
    // credentials 'omit' keeps Google sign-ins out of it, so it works on phones with several Google accounts
    fetch(API_URL + '?format=json&id=' + encodeURIComponent(id), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.found) show(LOOK[d.status] ? d.status : 'UNKNOWN', d); else show('UNKNOWN'); })
      .catch(function () { show('OFFLINE'); });
  }
</script>
</body>
</html>
