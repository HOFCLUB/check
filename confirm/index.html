<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HOF Email Confirm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/hof.css">
<style>.brandtop{text-align:center;margin-top:10px}.brandtop img{width:34px}.brandtop div{font:900 13px Montserrat,Arial,sans-serif;letter-spacing:.4em;margin-top:10px}.spin{display:inline-block;width:14px;height:14px;border:2px solid #555;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}</style>
</head>
<body>
<main>
  <div class="brandtop"><img src="../assets/flame-white.png" alt=""><div>HEART OF FIRE</div></div>
  <section class="panel gate" id="g"><p><span class="spin"></span></p></section>
</main>
<script src="../assets/hof.js"></script>
<script>
// The token comes after # so it never reaches a server log. It is cleared from the address bar straight away.
const T = location.hash.slice(1); history.replaceState(null, '', location.pathname);
const ic = '<div class="ic"><svg width="20" height="22" viewBox="0 0 20 22"><rect x="2" y="10" width="16" height="11" rx="2" fill="none" stroke="#C9CED6" stroke-width="2"/><path d="M6 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#C9CED6" stroke-width="2"/></svg></div>';
const box = (id, ph, l) => `<div class="pwrap pinw"><input class="pin" id="${id}" type="password" inputmode="numeric" maxlength="6" placeholder="${ph}" aria-label="${l}" autocomplete="off"><button type="button" class="eye" data-for="${id}" aria-label="Show PIN">Show</button></div>`;
const g = $('g');
function bad(m) { g.innerHTML = ic + '<h2>Link not valid</h2><p>' + esc(m) + '</p>'; }
if (!T) bad('This page needs the link from your email.');
else hofApi('confirmEmail', { token: T }).then(d => { g.innerHTML = ic + '<h2>Email confirmed</h2><p>Thanks, ' + esc(d.first) + '. HOF emails now go to this address.</p>'; }).catch(e => bad(e.message));
</script>
<script>
// The token comes after # so it never reaches a server log. It is cleared from the address bar straight away.
const T = location.hash.slice(1); history.replaceState(null, '', location.pathname);
const ic = '<div class="ic"><svg width="20" height="22" viewBox="0 0 20 22"><rect x="2" y="10" width="16" height="11" rx="2" fill="none" stroke="#C9CED6" stroke-width="2"/><path d="M6 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#C9CED6" stroke-width="2"/></svg></div>';
const box = (id, ph, l) => `<div class="pwrap pinw"><input class="pin" id="${id}" type="password" inputmode="numeric" maxlength="6" placeholder="${ph}" aria-label="${l}" autocomplete="off"><button type="button" class="eye" data-for="${id}" aria-label="Show PIN">Show</button></div>`;
const g = $('g');
function bad(m) { g.innerHTML = ic + '<h2>Link not valid</h2><p>' + esc(m) + '</p>'; }
if (!T) bad('This page needs the link from your email. Open your card, tap Specs, then Forgot PIN for a new one.');
else hofApi('pinInfo', { token: T }).then(d => {
  g.innerHTML = ic + `<h2>${d.kind === 'RESET' ? 'Set a new PIN' : 'Create your PIN'}</h2><p>Hi ${esc(d.first)}. Pick 4 to 6 numbers. Your phone remembers it, so you only type it once.</p>${box('p1', '••••', 'New PIN')}${box('p2', 'again', 'Repeat PIN')}<div class="err" id="err"></div><button class="btn" id="save">Save PIN</button>`;
  g.querySelectorAll('.eye').forEach(b => b.onclick = () => { const i = $(b.dataset.for); const s = i.type === 'password'; i.type = s ? 'text' : 'password'; b.textContent = s ? 'Hide' : 'Show'; });
  $('save').onclick = () => {
    const a = $('p1').value, b = $('p2').value;
    if (!/^\d{4,6}$/.test(a)) { $('err').textContent = 'Use 4 to 6 numbers.'; return; }
    if (a !== b) { $('err').textContent = "Those don't match. Try again."; return; }
    $('save').disabled = true;
    hofApi('pinSet', { token: T, pin: a }).then(r => {
      store('hofpin_' + r.cardId, a);
      g.innerHTML = ic + `<h2>You're in, ${esc(r.first)}</h2><p>Your PIN is set and this phone remembers it.</p><a class="btn" style="display:block;text-align:center;text-decoration:none" href="../card/?id=${encodeURIComponent(r.cardId)}#specs">Open my Specs</a>`;
    }).catch(e => { $('err').textContent = e.message; $('save').disabled = false; });
  };
}).catch(e => bad(e.message));
</script>
</body>
</html>
